<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Awaaz360</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p.tagline {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #dcdcdc;
    }

    p.description {
      max-width: 600px;
      margin-bottom: 30px;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .btn {
      background-color: #fff;
      color: #2a5298;
      padding: 12px 30px;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>Welcome to Awaaz360</h1>
  <p class="tagline">Voice for Every Village</p>
  <p class="description">
    Awaaz360 empowers villagers to anonymously report illegal or harmful activities like crop burning, water pollution, or waste mismanagement. 
    Track issue status, educate communities, and hold authorities accountable—one report at a time.
  </p>
  <a href="Awaaz360/HTML/index.html" class="btn">Go to Dashboard</a>
</body>
</html>
